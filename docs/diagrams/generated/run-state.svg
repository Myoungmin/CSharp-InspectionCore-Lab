7188" y2="268.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.4688" x="1039" y="260.6426">Persisting</text></g><g class="entity" data-qualified-name="Faulted" data-source-line="6" id="ent0008"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="66.6963" x="741" y="367.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="741" x2="807.6963" y1="395.2188" y2="395.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.6963" x="751" y="387.1426">Faulted</text></g><g class="entity" data-qualified-name="Succeeded" data-source-line="7" id="ent0010"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="90.0547" x="990.5" y="367.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="990.5" x2="1080.5547" y1="395.2188" y2="395.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.0547" x="1000.5" y="387.1426">Succeeded</text></g><g class="entity" data-qualified-name="Canceled" data-source-line="9" id="ent0013"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="79.1514" x="427" y="367.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="427" x2="506.1514" y1="395.2188" y2="395.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.1514" x="437" y="387.1426">Canceled</text></g><g class="entity" data-qualified-name="TimedOut" data-source-line="10" id="ent0015"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="81.4619" x="296" y="367.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="296" x2="377.4619" y1="395.2188" y2="395.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.4619" x="306" y="387.1426">TimedOut</text></g><g class="end_entity" data-qualified-name=".end." data-source-line="12" id="ent0018"><ellipse cx="517.5" cy="507.6094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="517.5" cy="507.6094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN23" data-source-line="17" id="ent0024"><path d="M1128.5,236.6094 L1128.5,262.1094 L1110.3281,266.1094 L1128.5,270.1094 L1128.5,295.6641 A0,0 0 0 0 1128.5,295.6641 L1412.5278,295.6641 A0,0 0 0 0 1412.5278,295.6641 L1412.5278,246.6094 L1402.5278,236.6094 L1128.5,236.6094 A0,0 0 0 0 1128.5,236.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1402.5278,236.6094 L1402.5278,246.6094 L1412.5278,246.6094 L1402.5278,236.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3125" x="1134.5" y="255.1045">CancelRun returns TooLate.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.0278" x="1134.5" y="271.4561">Timeout cannot replace persistence outcome.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.4561" x="1134.5" y="287.8076">Product Fail can still become Succeeded.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="22" id="ent0027"><path d="M6,236.6094 L6,295.6641 A0,0 0 0 0 6,295.6641 L339.1396,295.6641 A0,0 0 0 0 339.1396,295.6641 L339.1396,270.1094 L356.9425,266.1094 L339.1396,262.1094 L339.1396,246.6094 L329.1396,236.6094 L6,236.6094 A0,0 0 0 0 6,236.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M329.1396,236.6094 L329.1396,246.6094 L339.1396,246.6094 L329.1396,236.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0151" x="12" y="255.1045">Slot stays Busy while waiting for work and callbacks.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0361" x="12" y="271.4561">First accepted reason is preserved.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.1396" x="12" y="287.8076">Native RequestStop is only a request; Wait joins work.</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="27" id="ent0030"><path d="M567.5,454.6094 L567.5,562.7188 A0,0 0 0 0 567.5,562.7188 L981.1914,562.7188 A0,0 0 0 0 981.1914,562.7188 L981.1914,464.6094 L971.1914,454.6094 L778.5,454.6094 L774.5,417.7858 L770.5,454.6094 L567.5,454.6094 A0,0 0 0 0 567.5,454.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M971.1914,454.6094 L971.1914,464.6094 L981.1914,464.6094 L971.1914,454.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.5933" x="573.5" y="473.1045">Ordinary run failure leaves the engine Ready.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0513" x="573.5" y="489.4561">Stop/Wait/cleanup failure faults the engine and blocks admission.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.6914" x="573.5" y="505.8076">Unconfirmed Wait: resources retained; TerminationConfirmed=false.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.8677" x="573.5" y="522.1592">Completion then means failure arbitration, not native termination.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.9287" x="573.5" y="538.5107">Faulted survives Dispose; normal lifetime ends in Disposed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8696" x="573.5" y="554.8623">Ready and IsBusy describe different properties.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" id="lnk3"><polygon fill="#181818" points="802.5,130.3575,806.5,121.3575,802.5,125.3575,798.5,121.3575,802.5,130.3575" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M802.5,74.7678 C802.5,88.5312 802.5,107.3177 802.5,125.3575" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.458" x="804.5" y="108.1045">slot reserved / Accepted</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk5"><polygon fill="#181818" points="455.9524,240.8773,465.656,239.192,460.1066,238.0947,461.2039,232.5453,455.9524,240.8773" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M766.4645,158.0101 C714.1596,160.9844 614.795,170.205 535.5,198.6094 C506.9985,208.8189 481.7659,223.5867 460.1066,238.0947" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.9961" x="537.5" y="214.1045">first UserCancellation / Timeout / Shutdown</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" id="lnk7"><polygon fill="#181818" points="1028.9128,243.4032,1022.6095,235.8356,1024.4283,241.1921,1019.0718,243.0108,1028.9128,243.4032" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M838.6526,168.797 C881.2705,183.4964 953.9604,209.6131 1014.5,236.6094 C1019.2146,238.7118 1019.6103,238.8166 1024.4283,241.1921" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.188" x="971.5" y="214.1045">persistence wins shared lock</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" id="lnk9"><polygon fill="#181818" points="783.6903,367.4575,790.2776,360.1357,785.2366,362.7026,782.6698,357.6616,783.6903,367.4575" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M802.668,180.6357 C802.4975,217.397 800.4723,289.6501 788.5,349.6094 C787.3261,355.4885 787.1142,356.9292 785.2366,362.7026" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.5215" x="803.5" y="271.6045">execution failure / no accepted stop</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0010" data-link-type="dependency" id="lnk11"><polygon fill="#181818" points="1042.1514,367.2534,1048.3811,359.6251,1043.4687,362.43,1040.6637,357.5176,1042.1514,367.2534" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1062.9445,291.1142 C1056.9624,313.019 1049.4806,340.4159 1043.4687,362.43" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1333" x="1058.5" y="337.1045">save succeeds and cleanup finishes</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" id="lnk12"><polygon fill="#181818" points="808.2502,369.7807,818.013,368.4816,812.5115,367.1651,813.828,361.6636,808.2502,369.7807" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1028.9305,289.7703 C1024.1519,291.9459 1019.2759,293.9541 1014.5,295.6094 C974.3088,309.5397 960.6027,299.4266 920.5,313.6094 C879.9955,327.9343 841.2688,349.5134 812.5115,367.1651" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.5107" x="922.5" y="337.1045">save or cleanup fails</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0013" data-link-type="dependency" id="lnk14"><polygon fill="#181818" points="426.7698,380.9107,419.9407,373.814,422.1384,379.0265,416.9259,381.2242,426.7698,380.9107" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M398.323,291.2843 C393.0885,297.9818 388.2897,305.6229 385.5,313.6094 C380.2237,328.7144 377.1886,335.9375 385.5,349.6094 C394.6337,364.6339 406.4437,372.6413 422.1384,379.0265" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.4907" x="403.5786" y="329.1045">work + callbacks ended</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.6479" x="387.5" y="345.4561">UserCancellation / Shutdown</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0015" data-link-type="dependency" id="lnk16"><polygon fill="#181818" points="295.8862,385.2922,288.2014,379.1322,291.051,384.0189,286.1643,386.8685,295.8862,385.2922" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M362.2613,291.1922 C357.3062,292.8078 352.3425,294.3073 347.5,295.6094 C323.5801,302.0411 253.5383,294.7333 237.5,313.6094 C227.14,325.8024 228.6677,336.2681 237.5,349.6094 C250.486,369.2249 269.8363,378.4326 291.051,384.0189" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.4907" x="239.5" y="329.1045">work + callbacks ended</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.96" x="283.7654" y="345.4561">Timeout</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" id="lnk17"><polygon fill="#181818" points="740.731,391.9786,731.8451,387.73