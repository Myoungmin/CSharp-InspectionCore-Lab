45">Slot stays Busy until actual completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0361" x="12" y="271.4561">First accepted reason is preserved.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3779" x="12" y="287.8076">M2 native calls must return on their own.</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="27" id="ent0030"><path d="M492,454.6094 L492,530.0156 A0,0 0 0 0 492,530.0156 L858.4395,530.0156 A0,0 0 0 0 858.4395,530.0156 L858.4395,464.6094 L848.4395,454.6094 L679,454.6094 L675,417.7105 L671,454.6094 L492,454.6094 A0,0 0 0 0 492,454.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M848.4395,454.6094 L848.4395,464.6094 L858.4395,464.6094 L848.4395,454.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.5933" x="498" y="473.1045">Ordinary run failure leaves the engine Ready.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.4395" x="498" y="489.4561">Stop/cleanup failure faults the engine and blocks admission.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.4878" x="498" y="505.8076">Engine lifetime: Ready -&gt; Stopping -&gt; Disposed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8696" x="498" y="522.1592">Ready and IsBusy describe different properties.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" id="lnk3"><polygon fill="#181818" points="695,130.3575,699,121.3575,695,125.3575,691,121.3575,695,130.3575" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M695,74.7678 C695,88.5312 695,107.3177 695,125.3575" fill