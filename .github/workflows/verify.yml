name: Windows verification

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows x64 verification
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_UI_LANGUAGE: en

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize evidence
        run: |
          New-Item -ItemType Directory -Path artifacts/ci -Force | Out-Null
          $evidence = [ordered]@{
            commit = (git rev-parse HEAD)
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            event = $env:GITHUB_EVENT_NAME
            image = $env:ImageOS
            imageVersion = $env:ImageVersion
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'artifacts/ci/workflow.json'),
            ($evidence | ConvertTo-Json), [Text.UTF8Encoding]::new($false))

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: false

      - name: Check tools and run verification
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci.ps1

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/ci/
            artifacts/verification/**/summary.json
            artifacts/verification/**/source-manifest.json
            artifacts/verification/**/*.trx
            artifacts/verification/**/*.log
            artifacts/ipc-tests/**/*.log
